<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dce8e3">
    <title>Radio Studio — превью</title>
    <link rel="stylesheet" href="./studio-preview.css">
  </head>
  <body>
    <main class="preview-shell">
      <header class="preview-header">
        <div>
          <p class="eyebrow">ГОРОД ПРОФЕССИЙ · RADIO</p>
          <h1>Студия ведущего</h1>
        </div>
        <button id="on-air-toggle" type="button" aria-pressed="false">Включить эфир</button>
      </header>
      <section id="studio" class="studio-view" aria-label="Трёхмерная студия радиоведущего"></section>
      <footer class="preview-footer"><span id="status-light" aria-hidden="true"></span><span id="status-label">Студия готова к эфиру</span><span class="hint">Неподвижный вид от места ведущего</span></footer>
    </main>
    <script type="module" src="./studio-preview.js"></script>
  </body>
</html>
